<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>Mizva Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#1E2A44; --ink2:#5B6478; --line:#ECE6DA;
  --gold:#E3A624; --gold2:#FFF1CF; --blue:#3653A6; --blue2:#E3EAFB;
  --green:#2E9E6A; --green2:#DDF3E8; --violet:#7656B8; --violet2:#ECE5FA;
  --sky:#2F86B8; --sky2:#E0F0F9; --rose:#D0566B;
  --r:22px; --shadow:0 6px 20px rgba(30,42,68,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9E5DC;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.view{padding:18px 18px 130px}
h1{font-size:30px;font-weight:900;margin:0;line-height:1.15}
h2{font-size:21px;font-weight:900;margin:22px 0 12px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:17px}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--ink2);font-weight:700}
.btn.soft{background:var(--gold2);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
.t-Morgen{background:var(--gold2);color:#8A6000}
.t-Tag{background:var(--green2);color:#1D6E49}
.t-Abend{background:var(--violet2);color:#56389A}
.t-Jederzeit{background:var(--sky2);color:#1F6489}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.center{text-align:center}
.stack>*+*{margin-top:12px}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:84px;background:rgba(246,243,236,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#9AA0AE}
nav.tabs button.on{color:var(--gold)}
nav.tabs svg{width:25px;height:25px}
.ringbtn{position:relative;top:-22px;width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--card);box-shadow:0 6px 18px rgba(30,42,68,.15);display:flex!important;align-items:center;justify-content:center}
.ringbtn .lbl{position:absolute;font-weight:900;font-size:22px;color:var(--ink)}
.ringbtn .lbl small{font-size:13px;color:var(--ink2)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin:6px 0 18px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:26px;font-weight:900}
.stats span{font-size:13px;color:var(--ink2);font-weight:600}

/* live counter */
.live{background:#FFF8E8;border:1px solid #F3E2B8;border-radius:var(--r);padding:16px 18px}
.live .k{font-size:12px;letter-spacing:.14em;font-weight:800;color:#A07A20}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.bar{height:9px;background:#F0E7D3;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .6s}
.big{font-size:34px;font-weight:900}

/* challenge */
.chal{background:linear-gradient(135deg,#25356B,#3653A6);color:#fff;border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.chal .k{font-size:12px;letter-spacing:.14em;font-weight:800;opacity:.85}
.chal h3{font-size:25px;font-weight:900;margin:6px 0}
.chal .emo{position:absolute;right:-6px;top:10px;font-size:84px;opacity:.9;transform:rotate(-8deg)}
.chal .go{background:#fff;color:var(--blue);padding:11px 18px;border-radius:999px;font-weight:800;display:inline-flex;gap:6px;margin-top:12px}

/* timeline */
.tl{position:relative;margin-left:4px}
.tl-item{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;margin-bottom:14px}
.tl-item:before{content:"";position:absolute;left:13px;top:34px;bottom:-14px;width:3px;background:#E6DDCB}
.tl-item:last-child:before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;border:3px solid #E6DDCB;background:var(--bg);margin-top:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.tl-dot.now{background:var(--gold);border-color:var(--gold)}
.tl-dot.done{background:var(--green);border-color:var(--green)}
.mz{cursor:pointer}
.mz h4{margin:0 0 8px;font-size:21px;font-weight:900}
.mz.done{opacity:.6}
.mz.done h4{text-decoration:line-through;text-decoration-thickness:2px}
.check{width:38px;height:38px;border-radius:50%;border:3px solid #E6DDCB;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.mz .acts{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:700;font-size:14px}
.cta{white-space:nowrap;padding:9px 15px;border-radius:999px;font-weight:800;font-size:14px}
.addmore{border:2px dashed #E0D5BF;border-radius:var(--r);padding:18px;background:#F3EEE3}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 34px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:44px;height:5px;border-radius:5px;background:#D9D1C1;margin:0 auto 16px}
.lab{font-size:13px;letter-spacing:.12em;font-weight:800;color:#B07F12;margin:16px 0 4px}
.prayer{background:var(--gold2);border-radius:18px;padding:16px;font-size:17px;line-height:1.5;text-align:center;color:#6B4C00;font-weight:700}
.heb{direction:rtl;font-size:21px;font-family:"SBL Hebrew","Times New Roman",serif;margin-bottom:8px;color:var(--ink)}

/* feed */
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:13px;font-weight:800;color:var(--ink2)}
.week .c{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#F1EBDF;margin-top:6px;font-size:15px}
.week .c.done{background:var(--ink);color:#fff}
.week .c.today{outline:3px solid var(--gold);outline-offset:1px}
.week .c.shab{background:var(--gold2)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.story{flex:none;text-align:center;font-size:13px;font-weight:700;width:74px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;flex:none}
.story .av{width:70px;height:70px;font-size:24px;outline:3px solid var(--gold);outline-offset:3px;margin:4px auto 8px}
.post{background:var(--card);margin:16px -18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.post .hd{padding:14px 18px}
.post .img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:110px;background-size:cover;background-position:center}
.post .tx{padding:14px 18px 6px;font-size:16px}
.post .ac{display:flex;justify-content:space-around;padding:6px 0 12px;font-weight:800;color:var(--ink2)}
.post .ac button{display:flex;align-items:center;gap:6px;padding:8px}
.post .ac .on{color:var(--gold)}
.badge{background:var(--gold2);color:#8A6000;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px}

/* profile */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:12px -18px 0}
.grid3>div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;background-size:cover;background-position:center}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-weight:700}
.list .it:last-child{border:0}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding:28px 22px 34px}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.field{width:100%;padding:17px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;outline:none}
.field:focus{border-color:var(--gold)}
.halo{width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#FFE9B8 0 45%,#FFF4DA 46% 70%,transparent 71%);display:flex;align-items:center;justify-content:center;margin:0 auto}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.streaknum{font-size:110px;font-weight:900;color:var(--gold);line-height:1;margin-top:6px}

/* admin */
.adm{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.adm label{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin:8px 0 3px}
.adm input,.adm textarea,.adm select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FCFBF8}
.adm textarea{min-height:64px;resize:vertical}
.tag{font-size:11px;font-weight:900;letter-spacing:.1em;background:var(--ink);color:#fff;padding:4px 9px;border-radius:8px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;animation:up .25s;white-space:nowrap}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:70;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>

<script>

const AV=['#3653A6','#D0566B','#2E9E6A','#7656B8','#E3A624','#2F86B8'];

/* Maskottchen: kleine Kerze */
function candle(size=150,awake=false){return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">
 <path d="M60 8c10 14 20 22 20 36a20 20 0 0 1-40 0c0-14 10-22 20-36z" fill="#F5B53A"/>
 <path d="M60 24c5 8 10 12 10 20a10 10 0 0 1-20 0c0-8 5-12 10-20z" fill="#FFE29A"/>
 <rect x="34" y="60" width="52" height="54" rx="14" fill="#1E2A44"/>
 ${awake?'<circle cx="50" cy="82" r="4" fill="#fff"/><circle cx="70" cy="82" r="4" fill="#fff"/>':'<path d="M44 82q6 6 12 0M64 82q6 6 12 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>'}
 <path d="M52 95q8 8 16 0" stroke="#F5B53A" stroke-width="4" fill="none" stroke-linecap="round"/>
 <circle cx="42" cy="92" r="4" fill="#D0566B" opacity=".5"/><circle cx="78" cy="92" r="4" fill="#D0566B" opacity=".5"/></svg>`}

function ring(done,total,size=74){const r=31,c=2*Math.PI*r,p=total?done/total:0;return `<svg width="${size}" height="${size}" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#F1EBDF" stroke-width="6"/><circle cx="37" cy="37" r="${r}" fill="none" stroke="${done>=total&&total?'#2E9E6A':'#E3A624'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 37 37)" style="transition:stroke-dashoffset .6s"/></svg>`}

/* ---------- toast / confetti ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function confetti(){const cols=['#E3A624','#3653A6','#2E9E6A','#D0566B','#7656B8'];for(let i=0;i<40;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}

/* ===================== ONBOARDING ===================== */
function renderOnboarding(){
 const st=S.obStep,app=$('#app');
 if(st===0)app.innerHTML=`<div class="ob"><div class="grow center"><div class="pop">${candle(170,true)}</div>
   <h1 style="font-size:40px;margin-top:10px">Mizva Club</h1>
   <p class="muted" style="font-size:19px;margin:10px 20px 0">Kleine Mizwot. Jeden Tag.<br>Gemeinsam mehr Licht.</p></div>
   <button class="btn" onclick="ob(1)">Los geht's</button></div>`;
 if(st===1)app.innerHTML=`<div class="ob"><div class="grow"><p class="lab" style="margin:0">WILLKOMMEN</p><h1>Wie heißt du?</h1>
   <p class="muted">So sehen dich deine Freunde im Club.</p>
   <input id="nm" class="field" style="margin-top:22px" placeholder="Dein Vorname" value="${esc(S.name)}" autocomplete="given-name"></div>
   <button class="btn" onclick="const v=$('#nm').value.trim();if(!v){$('#nm').focus();return}S.name=v;ob(2)">Weiter</button></div>`;
 if(st===2){const m=S.mitzvot.find(x=>x.id==='m5')||S.mitzvot[0];
  app.innerHTML=`<div class="ob"><div class="grow"><p class="lab center" style="margin:0">✨ DEINE ERSTE MIZWA ✨</p><h1 class="center">${esc(m.title)}</h1>
   <div class="center" style="margin:10px 0 18px"><span class="pill" style="background:#EFE8DA">⏱ ${esc(m.min)}</span></div>
   <div class="card"><div class="lab" style="margin-top:0">WAS ES IST</div><div style="font-size:17px">${esc(m.what)}</div>
   <div class="lab">WARUM ES ZÄHLT</div><div style="font-size:17px">${esc(m.why)}</div>
   <div class="prayer" style="margin-top:16px">${esc(m.text)}</div></div>
   <p class="muted center small" style="margin-top:16px">Jede Mizwa im Club baut deine Serie auf. Diese startet sie.</p></div>
   <button class="btn" onclick="markDone('${m.id}',true);ob(3)">${I.check} Ich hab's gemacht</button>
   <button class="btn ghost" onclick="ob(4)">Nicht jetzt</button></div>`}
 if(st===3)app.innerHTML=`<div class="ob"><div class="grow center"><div class="halo pop">${candle(150)}</div>
   <div class="streaknum pop">${Math.max(1,streak())}</div><div style="font-size:24px;font-weight:900;color:var(--gold)">Tage in Folge</div>
   <p class="muted" style="font-size:17px;margin:18px 10px">Das war deine erste Mizwa, ${esc(S.name)}. Deine Serie beginnt heute. Komm morgen wieder, damit sie weiterbrennt.</p></div>
   <button class="btn" onclick="ob(4)">Weiter</button></div>`;
 if(st===4)app.innerHTML=`<div class="ob"><div class="grow"><div class="stack">
   ${[['Schkoach!','Jemand hat dir Schkoach für deine Mizwa gegeben.','jetzt'],['Neuer Kommentar','„Wunderbar, weiter so!“','vor 2 Min.'],['Erinnerung','Ein sanfter Hinweis: heute schon eine Mizwa?','heute früh']].map(n=>`
   <div class="card row" style="padding:14px"><div style="width:44px;height:44px;border-radius:12px;background:var(--gold2);display:flex;align-items:center;justify-content:center">${candle(36)}</div>
   <div style="flex:1"><div class="row between"><b>${n[0]}</b><span class="muted small">${n[2]}</span></div><div class="muted small">${n[1]}</div></div></div>`).join('')}</div>
   <h1 class="center" style="margin-top:30px">Verpasse kein Schkoach</h1>
   <p class="muted center">Erfahre, wenn Freunde dich anfeuern, und bekomm einen sanften Hinweis, damit deine Serie weiterbrennt. Nie aufdringlich – jederzeit abschaltbar.</p></div>
   <button class="btn" onclick="askNotif()">Benachrichtigungen aktivieren</button>
   <button class="btn ghost" onclick="finishOb()">Später</button></div>`;
}
function ob(n){S.obStep=n;save();renderOnboarding();window.scrollTo(0,0)}
function askNotif(){try{if('Notification'in window)Notification.requestPermission().finally(finishOb);else finishOb()}catch(e){finishOb()}}
function finishOb(){S.onboarded=true;save();tab='heute';render()}

/* ===================== ACTIONS ===================== */
function markDone(id,quiet){const k=dkey();S.done[k]=S.done[k]||[];if(S.done[k].includes(id)){S.done[k]=S.done[k].filter(x=>x!==id);save();if(!quiet)render();return}
 S.done[k].push(id);globalBase++;save();if(quiet)return;
 const n=S.done[k].length,t=S.mitzvot.length;closeSheet();render();
 if(n===t){confetti();toast('Alle Mizwot heute geschafft! 🎉')}else if(n===1){confetti();toast('🔥 Serie: '+streak()+' Tag'+(streak()>1?'e':''))}else toast('+1 Mizwa · '+n+'/'+t)}
function like(id){S.liked[id]=!S.liked[id];const p=S.posts.find(x=>x.id===id);p.likes+=S.liked[id]?1:-1;save();render()}
function go(t){tab=t;render();window.scrollTo(0,0)}

/* ---------- sheets ---------- */
function openSheet(html){closeSheet();const s=document.createElement('div');s.className='scrim';s.id='scrim';s.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>${html}</div>`;s.onclick=closeSheet;document.body.appendChild(s)}
function closeSheet(){$('#scrim')?.remove()}
function openMitzvah(id){const m=S.mitzvot.find(x=>x.id===id),d=todayDone().includes(id);
 openSheet(`<div class="center"><div style="font-size:46px">${m.icon}</div><h1>${esc(m.title)}</h1>
  <div style="margin:10px 0"><span class="pill t-${m.time}">${m.time}</span> <span class="pill" style="background:#EFE8DA">⏱ ${esc(m.min)}</span></div></div>
  <div class="card"><div class="lab" style="margin-top:0">WAS ES IST</div><div>${esc(m.what)}</div>
  <div class="lab">WARUM ES ZÄHLT</div><div>${esc(m.why)}</div>
  <div class="prayer" style="margin-top:16px">${m.heb?`<div class="heb">${esc(m.heb)}</div>`:''}${esc(m.text)}</div></div>
  <div style="margin-top:18px" class="stack">
  <button class="btn ${d?'soft':''}" onclick="markDone('${id}')">${d?'Rückgängig machen':I.check+' Ich hab\'s gemacht'}</button>
  ${d?`<button class="btn soft" onclick="newPost('${id}')">${I.cam} Foto teilen</button>`:''}</div>`)}
function newPost(mid){const m=S.mitzvot.find(x=>x.id===mid)||{title:'Mizwa',icon:'✨'};
 openSheet(`<h1>Mizwa teilen</h1><p class="muted">Zeig der Community, was du heute gemacht hast.</p>
  <label class="card center" style="display:block;cursor:pointer;margin:14px 0" id="pick"><div style="font-size:50px">${m.icon}</div><b>Foto auswählen (optional)</b><input type="file" accept="image/*" hidden onchange="pickImg(this)"></label>
  <textarea id="ptx" class="field" style="min-height:90px;font-weight:600" placeholder="Schreib etwas dazu …"></textarea>
  <button class="btn" style="margin-top:14px" onclick="publish('${esc(m.title)}','${m.icon}')">Veröffentlichen</button>`)}
let pendingImg=null;
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pendingImg=c.toDataURL('image/jpeg',.8);$('#pick').innerHTML=`<img src="${pendingImg}" style="width:100%;border-radius:14px">`};im.src=r.result};r.readAsDataURL(f)}
function publish(mz,emo){S.posts.unshift({id:'u'+Date.now(),user:S.name,c:4,mz,emo,img:pendingImg,bg:'linear-gradient(135deg,#FFF1CF,#E3A624)',text:$('#ptx').value.trim(),t:'gerade eben',likes:0,comments:[],mine:true});pendingImg=null;save();closeSheet();go('feed');toast('Geteilt! 🙌')}
function openComments(id){const p=S.posts.find(x=>x.id===id);
 openSheet(`<h1>Kommentare</h1><div class="stack" style="margin:14px 0">${p.comments.length?p.comments.map(c=>`<div class="card" style="padding:12px 14px">${esc(c)}</div>`).join(''):'<p class="muted">Noch keine Kommentare.</p>'}</div>
  <div class="row"><input id="cm" class="field" placeholder="Kommentar …"><button class="iconbtn" style="flex:none;background:var(--ink);color:#fff" onclick="const v=$('#cm').value.trim();if(v){S.posts.find(x=>x.id==='${id}').comments.push(v);save();openComments('${id}');render()}">${I.check}</button></div>`)}

 <div class="chal" style="margin-top:16px"><div class="emo">${ch.emo}</div><div class="k">🏆 CHALLENGE</div><h3>${esc(ch.title)}</h3><div style="font-weight:700;opacity:.95;max-width:75%">${esc(ch.sub)}</div><div style="opacity:.8;font-size:14px;margin-top:4px">${esc(ch.prize)}</div>

 ${[['📖','Tehillim-Kette','Gemeinsam das ganze Buch Tehillim in einer Woche','312 dabei'],['🕯️','Schabbat-Kerzen','4 Freitage in Folge Kerzen zünden','1.204 dabei'],['🤝','30 gute Taten','Ein Monat, jeden Tag eine gute Tat','87 dabei']].map(c=>`<div class="card row" style="margin-bottom:12px"><div style="font-size:36px;width:56px;height:56px;border-radius:16px;background:var(--gold2);display:flex;align-items:center;justify-content:center;flex:none">${c[0]}</div><div style="flex:1"><b style="font-size:17px">${c[1]}</b><div class="muted small">${c[2]}</div><div class="small" style="font-weight:800;color:var(--blue);margin-top:4px">${c[3]}</div></div><span>›</span></div>`).join('')}`}

function vCommunity(){const g=globalBase+totalDone();
 return `<h1>Gemeinschaft</h1><p class="muted">Jede Mizwa zählt – auch deine.</p>
 <div class="live" style="margin-top:14px;text-align:center;padding:24px"><span class="pill" style="background:#fff;font-size:12px"><span class="dot"></span> LIVE</span>
  <div class="big" style="font-size:48px;margin-top:8px" id="gnum2">${g.toLocaleString('de-DE')}</div><div class="muted">Mizwot im Club dieses Jahr</div>
  <div class="bar" style="margin-top:14px"><i style="width:${g/1000}%"></i></div><div class="small muted" style="margin-top:6px;font-weight:700">Ziel: 100.000</div></div>
 <div class="stats card" style="margin-top:14px;padding:16px 0"><div><b>1.284</b><span>Mitglieder</span></div><div><b>312</b><span>heute aktiv</span></div><div><b>27</b><span>Kreise</span></div></div>
 <h2>Kreise</h2><p class="muted" style="margin-top:-6px">Mach mit deiner Gemeinde, Familie oder Freunden zusammen.</p>
 ${CIRCLES.map((c,i)=>`<div class="card row" style="margin-bottom:10px"><div class="av" style="width:48px;height:48px;border-radius:14px;background:${AV[i]}">${initials(c.n)}</div><div style="flex:1"><b>${c.n}</b><div class="muted small">${c.m} Mitglieder · ${c.s.toLocaleString('de-DE')} Mizwot</div></div><button class="pill" style="background:var(--ink);color:#fff;padding:8px 14px" onclick="this.textContent='✓ Dabei';this.style.background='#2E9E6A'">Beitreten</button></div>`).join('')}
 <button class="btn soft" style="margin-top:6px" onclick="toast('Kreis erstellen – kommt in Phase 2')">${I.plus} Eigenen Kreis gründen</button>`}

function vProfile(){const mine=S.posts.filter(p=>p.mine);
 return `<div class="row between"><span></span><button onclick="go('settings')">${I.gear}</button></div>
 <div class="row" style="gap:18px"><div class="av" style="width:92px;height:92px;font-size:34px;background:var(--blue)">${initials(S.name)}</div>
  <div class="stats" style="flex:1;margin:0"><div><b>${totalDone()}</b><span>Mizwot</span></div><div><b>0</b><span>Follower</span></div><div><b>${S.following.length}</b><span>Folge ich</span></div></div></div>
 <h2 style="margin:12px 0 8px">${esc(S.name)}</h2><span class="pill" style="background:var(--gold2);color:#8A6000;font-size:15px;padding:8px 14px">🔥 ${streak()} Tage in Folge</span>
 <div class="row" style="margin-top:16px;gap:10px"><button class="btn soft" style="padding:13px;font-size:15px" onclick="toast('Profil bearbeiten – Phase 2')">Profil bearbeiten</button><button class="btn soft" style="padding:13px;font-size:15px" onclick="invite()">Freunde finden</button></div>
 <button class="btn soft" style="margin-top:16px;border:1px solid #F3E2B8" onclick="newPost('')">${I.cam} Halte deine Mizwa fest ${I.plus}</button>
 ${mine.length?`<div class="grid3">${mine.map(p=>`<div style="background:${p.img?`url(${p.img})`:p.bg};background-size:cover;background-position:center">${p.img?'':p.emo}</div>`).join('')}</div>`
 :`<div class="center" style="padding:30px 10px"><div style="font-size:50px">📷</div><b style="font-size:19px">Noch keine Fotos</b><p class="muted">Mode Ani mit Aussicht, Tehillim im Park oder dein Lieblingsessen mit Bracha. Wähle eine Mizwa, mach ein Foto – und es lebt hier.</p></div>`}`}

function vSettings(){return `<div class="row" style="margin-bottom:10px"><button onclick="go('profil')">${I.back}</button><h1 style="font-size:22px;flex:1;text-align:center;margin-right:26px">Einstellungen</h1></div>
 <div class="lab">KONTO</div><div class="card list"><div class="it">Profil bearbeiten<span>›</span></div><div class="it"><div>Name<div class="muted small">${esc(S.name)}</div></div></div></div>
 <div class="lab">ERINNERUNGEN</div><div class="card list"><div class="it">Tägliche Erinnerung<span class="muted">08:00 ›</span></div></div>
 <div class="lab">PRIVATSPHÄRE</div><div class="card list"><div class="it"><div>Privates Konto<div class="muted small">Nur bestätigte Follower sehen deine Mizwot.</div></div><span>○</span></div><div class="it">Blockierte Nutzer<span>›</span></div></div>
 <div class="lab">VERWALTUNG</div><div class="card list"><div class="it" style="cursor:pointer" onclick="go('admin')"><div><span class="tag">ADMIN</span> Club verwalten<div class="muted small">Mizwot, Texte, Challenge und Beiträge bearbeiten.</div></div><span>›</span></div></div>
 <div class="lab">RECHTLICHES</div><div class="card list"><div class="it">Datenschutz<span>›</span></div><div class="it">Nutzungsbedingungen<span>›</span></div></div>
 <button class="btn soft" style="margin-top:20px" onclick="if(confirm('Prototyp zurücksetzen? Alle Demo-Daten werden gelöscht.')){try{localStorage.removeItem('${KEY}')}catch(e){}location.reload()}">Prototyp zurücksetzen</button>`}

/* ---------- ADMIN ---------- */
function vAdmin(){const ch=S.challenge;
 return `<div class="row" style="margin-bottom:6px"><button onclick="go('settings')">${I.back}</button><h1 style="font-size:22px;flex:1;text-align:center;margin-right:26px">Club verwalten</h1></div>
 <div class="card" style="background:#FFF8E8;border-color:#F3E2B8;margin-bottom:8px"><b>So funktioniert's:</b> <span class="muted">Was du hier änderst, sehen alle Mitglieder sofort – auf der Website und in den Apps, ohne App-Update. (Im Prototyp wird nur auf diesem Gerät gespeichert.)</span></div>
 <h2>Challenge</h2><div class="adm">
  <label>Titel</label><input value="${esc(ch.title)}" oninput="S.challenge.title=this.value;save()">
  <label>Beschreibung</label><input value="${esc(ch.sub)}" oninput="S.challenge.sub=this.value;save()">
  <label>Preis</label><input value="${esc(ch.prize)}" oninput="S.challenge.prize=this.value;save()">
  <div class="row"><div style="flex:1"><label>Tage</label><input type="number" min="1" value="${ch.days}" oninput="S.challenge.days=+this.value||1;save()"></div><div style="flex:1"><label>Mizwot / Tag</label><input type="number" min="1" value="${ch.perDay}" oninput="S.challenge.perDay=+this.value||1;save()"></div><div style="flex:1"><label>Symbol</label><input value="${esc(ch.emo)}" oninput="S.challenge.emo=this.value;save()"></div></div></div>
 <div class="row between"><h2>Mizwot (${S.mitzvot.length})</h2><button class="pill" style="background:var(--ink);color:#fff;padding:8px 14px" onclick="addMz()">${I.plus} Neu</button></div>
 ${S.mitzvot.map((m,i)=>`<details class="adm"><summary class="row between" style="cursor:pointer;list-style:none"><span><span style="font-size:20px">${m.icon}</span> <b>${esc(m.title)}</b></span><span class="pill t-${m.time}">${m.time}</span></summary>
  <div class="row"><div style="flex:3"><label>Name</label><input value="${esc(m.title)}" oninput="upd(${i},'title',this.value)"></div><div style="flex:1"><label>Symbol</label><input value="${esc(m.icon)}" oninput="upd(${i},'icon',this.value)"></div></div>
  <div class="row"><div style="flex:1"><label>Tageszeit</label><select onchange="upd(${i},'time',this.value)">${['Morgen','Tag','Abend','Jederzeit'].map(t=>`<option ${t===m.time?'selected':''}>${t}</option>`).join('')}</select></div><div style="flex:1"><label>Dauer</label><input value="${esc(m.min)}" oninput="upd(${i},'min',this.value)"></div><div style="flex:1"><label>Button</label><input value="${esc(m.cta)}" oninput="upd(${i},'cta',this.value)"></div></div>
  <label>Was es ist</label><textarea oninput="upd(${i},'what',this.value)">${esc(m.what)}</textarea>
  <label>Warum es zählt</label><textarea oninput="upd(${i},'why',this.value)">${esc(m.why)}</textarea>
  <label>Hebräischer Text (optional)</label><input dir="rtl" value="${esc(m.heb)}" oninput="upd(${i},'heb',this.value)">
  <label>Text / Gebet</label><textarea oninput="upd(${i},'text',this.value)">${esc(m.text)}</textarea>
  <div class="row" style="margin-top:10px;gap:8px"><button class="pill" style="background:#EFE8DA" onclick="mvMz(${i},-1)">↑</button><button class="pill" style="background:#EFE8DA" onclick="mvMz(${i},1)">↓</button><span style="flex:1"></span><button class="pill" style="background:#FBE3E7;color:var(--rose)" onclick="if(confirm('Mizwa löschen?')){S.mitzvot.splice(${i},1);save();render()}">Löschen</button></div></details>`).join('')}
 <h2>Beiträge prüfen</h2>${S.posts.map(p=>`<div class="adm row between"><div><b>${esc(p.user)}</b> <span class="muted small">· ${esc(p.mz)}</span><div class="small muted">${esc(p.text||'(ohne Text)')}</div></div><button class="pill" style="background:#FBE3E7;color:var(--rose);flex:none" onclick="if(confirm('Beitrag entfernen?')){S.posts=S.posts.filter(x=>x.id!=='${p.id}');save();render()}">Entfernen</button></div>`).join('')}
 <button class="btn soft" style="margin-top:14px" onclick="if(confirm('Mizwot-Liste auf Standard zurücksetzen?')){S.mitzvot=JSON.parse(JSON.stringify(DEFAULT_MITZVOT));S.challenge={...DEFAULT_CHALLENGE};save();render()}">Standard wiederherstellen</button>`}
function upd(i,k,v){S.mitzvot[i][k]=v;save();refreshNav()}
function mvMz(i,d){const j=i+d;if(j<0||j>=S.mitzvot.length)return;[S.mitzvot[i],S.mitzvot[j]]=[S.mitzvot[j],S.mitzvot[i]];save();render()}
function addMz(){S.mitzvot.push({id:'m'+Date.now(),title:'Neue Mizwa',time:'Tag',min:'1 Min',icon:'✨',cta:'Mehr erfahren',what:'',why:'',heb:'',text:''});save();render();setTimeout(()=>{const d=document.querySelectorAll('details.adm');d[d.length-1].open=true;d[d.length-1].scrollIntoView({behavior:'smooth'})},50)}

function invite(){const t='Komm in den Mizva Club – jeden Tag eine kleine Mizwa, gemeinsam mehr Licht ✨';if(navigator.share)navigator.share({title:'Mizva Club',text:t}).catch(()=>{});else{navigator.clipboard?.writeText(t);toast('Einladung kopiert')}}
function shareStreak(){const t=`🔥 ${streak()} Tage in Folge im Mizva Club!`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard?.writeText(t);toast('Kopiert')}}

/* ===================== RENDER ===================== */
function nav(){const d=todayDone().filter(id=>S.mitzvot.some(m=>m.id===id)).length,t=S.mitzvot.length;
 return `<nav class="tabs"><button class="${tab==='feed'?'on':''}" onclick="go('feed')">${I.home}Feed</button><button class="${tab==='challenge'?'on':''}" onclick="go('challenge')">${I.trophy}Challenges</button>
 <button class="ringbtn" onclick="go('heute')">${ring(d,t,84)}<span class="lbl">${d}<small>/${t}</small></span></button>
 <button class="${tab==='gemeinschaft'?'on':''}" onclick="go('gemeinschaft')">${I.people}Gemeinschaft</button><button class="${['profil','settings','admin'].includes(tab)?'on':''}" onclick="go('profil')">${I.user}Profil</button></nav>`}
function refreshNav(){const n=document.querySelector('nav.tabs');if(n)n.outerHTML=nav()}
function render(){if(!S.onboarded)return renderOnboarding();
 const V={heute:vHeute,feed:vFeed,challenge:vChallenge,gemeinschaft:vCommunity,profil:vProfile,settings:vSettings,admin:vAdmin}[tab]||vHeute;
 $('#app').innerHTML=`<div class="view">${V()}</div>${nav()}`}
render();
/* Live-Zähler tickt */
setInterval(()=>{if(Math.random()<.6){globalBase+=1+Math.floor(Math.random()*3);const g=(globalBase+totalDone()).toLocaleString('de-DE');['#gnum','#gnum2'].forEach(s=>{const e=$(s);if(e)e.textContent=g})}},2500);
</script>
</body>
</html>
